version: 2

models:
  - name: stg_raw__admissions
    columns:
      - name: admission_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["ADMITTED", "DISCHARGED"]
      - name: charges
        data_tests:
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__patients')
                field: patient_id
          
  - name: stg_raw__doctors
    columns:
      - name: doctor_id
        data_tests:
          - unique
          - not_null
  - name: stg_raw__patients
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: age
        data_tests:
          - not_null
