version: 2

models:
  - name: stg_raw__admissions
    columns:
      - name: admission_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["ADMITTED", "DISCHARGED"]
      - name: charges
        data_tests:
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__patients')
                field: patient_id
      - name: doctor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__doctors')
                field: doctor_id
      - name: admit_date
        data_tests:
          - not_null
      - name: discharge_date
      - name: length_of_stay
      - name: department
      - name: diagnosis
      - name: created_at

  - name: stg_raw__doctors
    description: This model provides detailed information about doctors, including their unique identifiers, names, specializations, and departments. It supports healthcare operations by enabling the identification and categorization of medical professionals.
    columns:
      - name: doctor_id
        description: A unique identifier for each doctor.
        data_tests:
          - unique
          - not_null
      - name: doctor_name
        description: The full name of the doctor.
        data_tests:
          - not_null
      - name: specialization
        description: The medical field in which the doctor specializes.
        data_tests:
          - not_null
      - name: department
        description: The department where the doctor works.
        data_tests:
          - not_null

  - name: stg_raw__patients
    description: This model captures detailed information about patients, including personal details and demographics, to support healthcare operations and analytics.
    columns:
      - name: patient_id
        description: A unique identifier for each patient.
        data_tests:
          - unique
          - not_null
      - name: gender
        description: The gender of the patient, with accepted values 'M' or 'F'.
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: age
        description: The age of the patient in years.
        data_tests:
          - not_null

      - name: first_name
        description: The first name of the patient.
      - name: last_name
        description: The last name of the patient.
      - name: dob
        description: The date of birth of the patient.
      - name: city
        description: The city where the patient resides.
      - name: blood_group
        description: The blood group of the patient.
      - name: created_at
        description: The timestamp when the patient record was created.